components:
  securitySchemes:
    accessCookie:
      type: apiKey
      in: cookie
      name: edu_access
    refreshCookie:
      type: apiKey
      in: cookie
      name: edu_refresh
    csrfHeader:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 16
        maxLength: 128
    OleadaId:
      name: oleadaId
      in: query
      schema:
        type: string
        format: uuid
    OleadaPathId:
      name: oleadaId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    EnrollmentId:
      name: enrollmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AssignmentId:
      name: assignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DeliverableId:
      name: deliverableId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SubmissionId:
      name: submissionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    MentorAssignmentId:
      name: mentorAssignmentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    FileId:
      name: fileId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExpectedVersion:
      name: expectedVersion
      in: query
      required: true
      schema:
        type: integer
        minimum: 1
  responses:
    Unauthorized:
      description: Autenticación ausente, expirada o revocada.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: Identidad válida sin permiso para la acción.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: Recurso ausente o deliberadamente oculto por ownership.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: Conflicto de horario, versión, estado o idempotencia.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    ScheduleConflict:
      description: Conflicto de agenda tipado o conflicto concurrente/de idempotencia.
      content:
        application/json:
          schema:
            anyOf:
              - $ref: "#/components/schemas/ScheduleConflictError"
              - $ref: "#/components/schemas/ErrorEnvelope"
    ConfirmationClosed:
      description: La ventana de confirmación ya cerró.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ConfirmationClosedError"
    ValidationError:
      description: DTO o regla de negocio inválida.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 128
          writeOnly: true
    ChangePasswordRequest:
      type: object
      additionalProperties: false
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          writeOnly: true
        newPassword:
          type: string
          minLength: 12
          maxLength: 128
          writeOnly: true
    Role:
      type: string
      enum: [PARTICIPANT, MENTOR, ADMIN]
    MentorCapability:
      type: string
      enum: [SPECIALIST, PEER]
    ProgramPhase:
      type: string
      enum: [FASE_0, FASE_1, FASE_2, FINISHED]
    SessionPhase:
      type: string
      enum: [FASE_1, FASE_2]
    OleadaStatus:
      type: string
      enum: [DRAFT, OPEN, IN_PROGRESS, CLOSED]
    EnrollmentStatus:
      type: string
      enum: [ACTIVE, WITHDRAWN, COMPLETED]
    MentorAssignmentStatus:
      type: string
      enum: [ACTIVE, CLOSED]
    AuthMe:
      type: object
      additionalProperties: false
      required:
        - id
        - fullName
        - email
        - organization
        - roles
        - mentorCapabilities
        - mustChangePassword
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
          format: email
        organization:
          $ref: "#/components/schemas/OrganizationRef"
        roles:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/Role"
        mentorCapabilities:
          type: array
          uniqueItems: true
          items:
            $ref: "#/components/schemas/MentorCapability"
        activeEnrollment:
          oneOf:
            - $ref: "#/components/schemas/ActiveEnrollment"
            - type: "null"
        mustChangePassword:
          type: boolean
    OrganizationRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    OleadaRef:
      type: object
      additionalProperties: false
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
    ActiveEnrollment:
      type: object
      additionalProperties: false
      required: [id, oleada, currentPhase]
      properties:
        id:
          type: string
          format: uuid
        oleada:
          $ref: "#/components/schemas/OleadaRef"
        currentPhase:
          $ref: "#/components/schemas/ProgramPhase"
        currentWeek:
          type:
            - integer
            - "null"
          minimum: 1
          maximum: 6
    UserRef:
      type: object
      additionalProperties: false
      required: [id, fullName]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
    ParticipantDashboard:
      type: object
      additionalProperties: false
      required: [sessions, deliverables]
      properties:
        sessions:
          type: object
          required: [attended, total]
          properties:
            attended:
              type: integer
              minimum: 0
            total:
              type: integer
              minimum: 0
            next:
              oneOf:
                - $ref: "#/components/schemas/SessionSummary"
                - type: "null"
        deliverables:
          type: object
          required: [submitted, expected]
          properties:
            submitted:
              type: integer
              minimum: 0
            expected:
              type: integer
              minimum: 0
            nextDueAt:
              type:
                - string
                - "null"
              format: date-time
    MentorDashboard:
      type: object
      additionalProperties: false
      required:
        - completedMinutes
        - upcomingSessions
        - pendingConfirmations
        - pendingRescheduleRequests
        - pendingReviews
      properties:
        completedMinutes:
          type: integer
          minimum: 0
        upcomingSessions:
          type: integer
          minimum: 0
        pendingConfirmations:
          type: integer
          minimum: 0
        pendingRescheduleRequests:
          type: integer
          minimum: 0
        pendingReviews:
          type: integer
          minimum: 0
    AdminDashboard:
      type: object
      additionalProperties: false
      required:
        - activeUsers
        - upcomingSessions
        - pendingDeliverables
        - failedJobs
        - totalOleadas
        - activeOleadas
        - totalParticipants
        - activeMentors
        - pendingReviews
        - completedSessions
        - submissionsSummary
      properties:
        activeUsers:
          type: integer
          minimum: 0
        upcomingSessions:
          type: integer
          minimum: 0
        pendingDeliverables:
          type: integer
          minimum: 0
        failedJobs:
          type: integer
          minimum: 0
        totalOleadas:
          type: integer
          minimum: 0
        activeOleadas:
          type: integer
          minimum: 0
        totalParticipants:
          type: integer
          minimum: 0
        activeMentors:
          type: integer
          minimum: 0
        pendingReviews:
          type: integer
          minimum: 0
        completedSessions:
          type: integer
          minimum: 0
        submissionsSummary:
          type: object
          additionalProperties: false
          required: [total, evaluated, pending, returned]
          properties:
            total:
              type: integer
              minimum: 0
            evaluated:
              type: integer
              minimum: 0
            pending:
              type: integer
              minimum: 0
            returned:
              type: integer
              minimum: 0

    SessionType:
      type: string
      enum: [ONE_ON_ONE, GROUP, CHECKPOINT]
    SessionStatus:
      type: string
      enum: [SCHEDULED, COMPLETED, CANCELLED, RESCHEDULED]
    ConfirmationStatus:
      type: string
      enum: [PENDING, CONFIRMED, DECLINED]
    AttendanceStatus:
      type: string
      enum: [PENDING, ATTENDED, ABSENT]
    CreateSessionRequest:
      type: object
      additionalProperties: false
      required:
        - oleadaId
        - title
        - type
        - phase
        - startsAt
        - durationMinutes
        - timezone
        - enrollmentIds
      properties:
        oleadaId:
          type: string
          format: uuid
        mentorUserId:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 160
        description:
          type: string
          maxLength: 4000
        type:
          $ref: "#/components/schemas/SessionType"
        phase:
          $ref: "#/components/schemas/SessionPhase"
        weekNumber:
          type: integer
          minimum: 1
          maximum: 6
        checkpointMonth:
          type: integer
          enum: [1, 2, 3, 6]
        startsAt:
          type: string
          format: date-time
        durationMinutes:
          type: integer
          minimum: 15
          maximum: 240
        timezone:
          type: string
          example: America/Lima
        meetingUrl:
          type: string
          format: uri
          maxLength: 2048
        enrollmentIds:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            format: uuid
    UpdateSessionRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        title:
          type: string
          maxLength: 160
        description:
          type: string
          maxLength: 4000
        meetingUrl:
          type: string
          format: uri
        expectedVersion:
          type: integer
          minimum: 1
    VersionedRequest:
      type: object
      additionalProperties: false
      required: [expectedVersion]
      properties:
        expectedVersion:
          type: integer
          minimum: 1
    ReasonedTransitionRequest:
      type: object
      additionalProperties: false
      required: [reason, expectedVersion]
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 1000
