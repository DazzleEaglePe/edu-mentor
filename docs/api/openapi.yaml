openapi: 3.1.0
info:
  title: EDU-MENTOR API
  version: 0.1.0
  description: |
    Contrato inicial del piloto. La autorización combina roles, mentor assignments
    y ownership. Los módulos futuros están deliberadamente excluidos.
  x-contract-status: technical-baseline
servers:
  - url: /api/v1
    description: Same-origin reverse proxy
tags:
  - name: Auth
    description: Inicio, rotación y cierre de sesiones autenticadas.
  - name: Dashboard
    description: Resúmenes derivados sin entidades analíticas nuevas.
  - name: Sessions
    description: Agenda, participantes, confirmación y asistencia.
  - name: Reschedule Requests
    description: Solicitudes del participante y decisión del mentor/admin.
  - name: Assignments
    description: Consignas, rúbricas y selección provisional Top 3.
  - name: Deliverables
    description: Entregables lógicos, revisiones, archivos y evaluaciones.
  - name: Admin
    description: Soporte operativo mínimo dentro de la organización.
security:
  - accessCookie: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Iniciar sesión
      operationId: login
      security:
        - csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Cookies de access/refresh establecidas.
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMe"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotar la sesión
      operationId: refreshSession
      security:
        - refreshCookie: []
          csrfHeader: []
      responses:
        "204":
          description: Tokens rotados y cookies actualizadas.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
  /auth/logout:
    post:
      tags: [Auth]
      summary: Cerrar la sesión actual
      operationId: logout
      security:
        - accessCookie: []
          csrfHeader: []
      responses:
        "204":
          description: Sesión revocada y cookies eliminadas.
  /auth/logout-all:
    post:
      tags: [Auth]
      summary: Cerrar todas mis sesiones
      operationId: logoutAll
      security:
        - accessCookie: []
          csrfHeader: []
      responses:
        "204":
          description: Todas las familias refresh del usuario fueron revocadas.
  /auth/csrf:
    get:
      tags: [Auth]
      summary: Obtener token CSRF
      operationId: getCsrfToken
      security: []
      responses:
        "200":
          description: Token vinculado al navegador same-site.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [csrfToken]
                properties:
                  csrfToken:
                    type: string
                    minLength: 32
  /auth/me:
    get:
      tags: [Auth]
      summary: Consultar identidad y contexto
      operationId: getAuthMe
      responses:
        "200":
          description: Identidad y contexto activo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMe"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/change-password:
    post:
      tags: [Auth]
      summary: Cambiar la contraseña propia
      operationId: changePassword
      security:
        - accessCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password actualizado; otras sesiones revocadas.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/ValidationError"
  /dashboard/participant:
    get:
      tags: [Dashboard]
      summary: Consultar resumen de participante
      operationId: getParticipantDashboard
      responses:
        "200":
          description: Métricas derivables del participante.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParticipantDashboard"
        "403":
          $ref: "#/components/responses/Forbidden"
  /dashboard/mentor:
    get:
      tags: [Dashboard]
      summary: Consultar resumen de mentor
      operationId: getMentorDashboard
      responses:
        "200":
          description: Métricas derivables del mentor.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorDashboard"
        "403":
          $ref: "#/components/responses/Forbidden"
  /dashboard/admin:
    get:
      tags: [Dashboard]
      summary: Consultar resumen administrativo
      operationId: getAdminDashboard
      responses:
        "200":
          description: Conteos operativos de la organización.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminDashboard"
        "403":
          $ref: "#/components/responses/Forbidden"
  /sessions:
    get:
      tags: [Sessions]
      summary: Listar sesiones
      operationId: listSessions
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/OleadaId"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/SessionStatus"
        - name: phase
          in: query
          schema:
            $ref: "#/components/schemas/SessionPhase"
        - name: from
          in: query
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Sesiones scoped por identidad.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionPage"
    post:
      tags: [Sessions]
      summary: Crear una sesión
      operationId: createSession
      security:
        - accessCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSessionRequest"
      responses:
        "201":
          description: Sesión y reservas creadas atómicamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/ScheduleConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /sessions/calendar:
    get:
      tags: [Sessions]
      summary: Consultar calendario de sesiones
      operationId: getSessionCalendar
      parameters:
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
      responses:
        "200":
          description: Sesiones livianas del rango autorizado.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SessionSummary"
  /sessions/{sessionId}:
    parameters:
      - $ref: "#/components/parameters/SessionId"
    get:
      tags: [Sessions]
      summary: Consultar una sesión
      operationId: getSession
      responses:
        "200":
          description: Detalle autorizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Sessions]
      summary: Actualizar contenido de una sesión
      operationId: updateSession
      security:
        - accessCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSessionRequest"
      responses:
        "200":
          description: Contenido no temporal actualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "409":
          $ref: "#/components/responses/Conflict"
  /sessions/{sessionId}/reschedule:
    post:
      tags: [Sessions]
      summary: Reprogramar directamente una sesión
      operationId: rescheduleSession
      security:
        - accessCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RescheduleSessionRequest"
      responses:
        "201":
          description: Sesión reemplazo; original en RESCHEDULED.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "409":
          $ref: "#/components/responses/ScheduleConflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /sessions/{sessionId}/cancel:
    post:
      tags: [Sessions]
      summary: Cancelar una sesión
      operationId: cancelSession
      security:
        - accessCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonedTransitionRequest"
      responses:
        "200":
          description: Sesión cancelada y reservas liberadas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "409":
          $ref: "#/components/responses/Conflict"
  /sessions/{sessionId}/complete:
    post:
      tags: [Sessions]
      summary: Completar una sesión
      operationId: completeSession
      security:
        - accessCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionedRequest"
      responses:
        "200":
          description: Sesión completada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "422":
          $ref: "#/components/responses/ValidationError"
  /sessions/{sessionId}/participants/me/confirmation:
    put:
      tags: [Sessions]
      summary: Cambiar mi confirmación
      operationId: setOwnSessionConfirmation
      security:
        - accessCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, expectedVersion]
              properties:
                status:
                  type: string
                  enum: [CONFIRMED, DECLINED]
                expectedVersion:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Confirmación propia actualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionParticipant"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ConfirmationClosed"
  /sessions/{sessionId}/participants/{enrollmentId}/attendance:
    put:
      tags: [Sessions]
      summary: Registrar asistencia de participante
      operationId: setParticipantAttendance
      security:
        - accessCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/EnrollmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status, expectedVersion]
              properties:
                status:
                  type: string
                  enum: [ATTENDED, ABSENT]
                expectedVersion:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Asistencia registrada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionParticipant"
        "403":
          $ref: "#/components/responses/Forbidden"
  /sessions/{sessionId}/reschedule-requests:
    post:
      tags: [Reschedule Requests]
      summary: Solicitar reprogramación
      operationId: createRescheduleRequest
      security:
        - accessCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateRescheduleRequest"
      responses:
        "201":
          description: Solicitud pendiente creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RescheduleRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /reschedule-requests:
    get:
      tags: [Reschedule Requests]
      summary: Listar solicitudes de reprogramación
      operationId: listRescheduleRequests
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/RescheduleRequestStatus"
      responses:
        "200":
          description: Participante ve las propias; mentor las de sesiones autorizadas; admin las de su organización.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/RescheduleRequest"
                  meta:
                    $ref: "#/components/schemas/PageMeta"
  /reschedule-requests/{requestId}/approve:
    post:
      tags: [Reschedule Requests]
      summary: Aprobar una reprogramación
      operationId: approveRescheduleRequest
      security:
        - accessCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveRescheduleRequest"
      responses:
        "201":
          description: Solicitud aprobada y sesión reemplazo creada.
          content:
            application/json:
              schema:
                type: object
                required: [request, replacementSession]
                properties:
                  request:
                    $ref: "#/components/schemas/RescheduleRequest"
                  replacementSession:
                    $ref: "#/components/schemas/Session"
        "409":
          $ref: "#/components/responses/ScheduleConflict"
  /reschedule-requests/{requestId}/reject:
    post:
      tags: [Reschedule Requests]
      summary: Rechazar una reprogramación
      operationId: rejectRescheduleRequest
      security:
        - accessCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonedTransitionRequest"
      responses:
        "200":
          description: Solicitud rechazada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RescheduleRequest"
  /reschedule-requests/{requestId}/cancel:
    post:
      tags: [Reschedule Requests]
      summary: Cancelar mi solicitud
      operationId: cancelOwnRescheduleRequest
      security:
        - accessCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/RequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VersionedRequest"
      responses:
        "200":
          description: Solicitud propia cancelada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RescheduleRequest"
  /assignments:
    get:
      tags: [Assignments]
      summary: Listar consignas
      operationId: listAssignments
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/OleadaId"
      responses:
        "200":
          description: Consignas autorizadas.
          content:
            application/json:
              schema:
                type: object
                required: [data, meta]
                properties:
                  data:
                    type: array
                    items:
                      $ref: "#/components/schemas/Assignment"
                  meta:
                    $ref: "#/components/schemas/PageMeta"
    post:
      tags: [Assignments]
      summary: Crear una consigna
      operationId: createAssignment
      security:
        - accessCookie: []
          csrfHeader: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssignmentRequest"
      responses:
        "201":
          description: Consigna creada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "422":
          $ref: "#/components/responses/ValidationError"
  /assignments/{assignmentId}:
    get:
      tags: [Assignments]
      summary: Consultar una consigna
      operationId: getAssignment
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      responses:
        "200":
          description: Consigna y rúbrica.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Assignments]
      summary: Actualizar una consigna editable
      operationId: updateAssignment
      security:
        - accessCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAssignmentRequest"
      responses:
        "200":
          description: Consigna actualizada antes de recibir submissions enviadas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Assignment"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /assignments/{assignmentId}/top-candidates:
    get:
      tags: [Assignments]
      summary: Consultar Top 3 provisional
      operationId: getTopCandidates
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      responses:
        "200":
          description: Baseline provisional Top 3 por assignment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopCandidates"
    put:
      tags: [Assignments]
      summary: Reemplazar Top 3 provisional
      operationId: replaceTopCandidates
      security:
        - accessCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/AssignmentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceTopCandidatesRequest"
      responses:
        "200":
          description: Ranking reemplazado atómicamente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TopCandidates"
        "409":
          $ref: "#/components/responses/Conflict"
  /deliverables:
    get:
      tags: [Deliverables]
      summary: Listar entregables
      operationId: listDeliverables
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          description: Filtra por el estado de la revisión apuntada por currentSubmissionId.
          schema:
            $ref: "#/components/schemas/SubmissionStatus"
      responses:
        "200":
          description: Entregables scoped.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliverablePage"
    post:
      tags: [Deliverables]
      summary: Crear entregable y primer draft
      operationId: createDeliverable
      security:
        - accessCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDeliverableRequest"
      responses:
        "201":
          description: Agregado y primera revisión draft.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deliverable"
        "409":
          $ref: "#/components/responses/Conflict"
  /deliverables/pending-review:
    get:
      tags: [Deliverables]
      summary: Listar revisiones por evaluar
      operationId: listPendingReviews
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Cola de submissions enviadas autorizadas.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliverablePage"
  /deliverables/{deliverableId}:
    get:
      tags: [Deliverables]
      summary: Consultar un entregable
      operationId: getDeliverable
      parameters:
        - $ref: "#/components/parameters/DeliverableId"
      responses:
        "200":
          description: Agregado con historial autorizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deliverable"
        "404":
          $ref: "#/components/responses/NotFound"
  /deliverables/{deliverableId}/submissions/{submissionId}:
    patch:
      tags: [Deliverables]
      summary: Editar notas de una revisión draft
      operationId: updateSubmissionDraft
      security:
        - accessCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/DeliverableId"
        - $ref: "#/components/parameters/SubmissionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSubmissionRequest"
      responses:
        "200":
          description: Notas actualizadas mientras la revisión permanece en DRAFT.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Submission"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /deliverables/{deliverableId}/submissions/{submissionId}/files:
    post:
      tags: [Deliverables]
      summary: Subir archivo a un draft
      operationId: uploadSubmissionFile
      security:
        - accessCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/DeliverableId"
        - $ref: "#/components/parameters/SubmissionId"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "202":
          description: Archivo almacenado en quarantine y scan pendiente.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliverableFile"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/ValidationError"
  /deliverables/{deliverableId}/submissions/{submissionId}/files/{fileId}:
    delete:
      tags: [Deliverables]
      summary: Eliminar archivo de un draft
      operationId: deleteSubmissionFile
      security:
        - accessCookie: []
          csrfHeader: []
      parameters:
        - $ref: "#/components/parameters/DeliverableId"
        - $ref: "#/components/parameters/SubmissionId"
        - $ref: "#/components/parameters/FileId"
        - $ref: "#/components/parameters/ExpectedVersion"
      responses:
        "204":
          description: Archivo desvinculado y programado para borrado seguro.
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /deliverables/{deliverableId}/submissions/{submissionId}/files/{fileId}/download:
    get:
      tags: [Deliverables]
      summary: Descargar archivo autorizado
      operationId: downloadSubmissionFile
      parameters:
        - $ref: "#/components/parameters/DeliverableId"
        - $ref: "#/components/parameters/SubmissionId"
        - $ref: "#/components/parameters/FileId"
      responses:
        "200":
          description: Stream auditado de un archivo con scan CLEAN.
          headers:
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
